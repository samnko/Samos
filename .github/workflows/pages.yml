# Static preview of the site on GitHub Pages: https://samnko.github.io/Samos/
# Pages serves the `gh-pages` branch; this workflow rebuilds it on every push to master.
# The production target remains Vercel (language redirect + contact API); on Pages the
# contact form falls back to WhatsApp.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /Samos
          NEXT_PUBLIC_SITE_URL: https://samnko.github.io/Samos
        run: |
          # Server-only features are not available on a static host
          rm -f proxy.ts
          rm -rf app/api
          npm run build
          cp scripts/static-index.html out/index.html
          touch out/.nojekyll
      - name: Publish to the gh-pages branch
        run: |
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Static preview from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
